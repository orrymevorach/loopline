name: Diagnose Toast Access

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnose-toast-access
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install full Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium

      - name: Check Toast event access using full Chromium
        run: xvfb-run --auto-servernum node scripts/contentful/diagnose-toast-browser.js --headed
