[build.environment]
  NODE_VERSION = "22"

[functions."sync-toast-events"]
  schedule = "0 10,11 * * *"

[functions."import-toast-events-background"]
  node_bundler = "esbuild"
  external_node_modules = ["@sparticuz/chromium", "playwright", "playwright-core"]
  included_files = [
    "node_modules/@sparticuz/chromium/bin/**",
    "node_modules/playwright/**",
    "node_modules/playwright-core/**",
    "node_modules/dotenv/**",
  ]
